name: Test osinstall.sh

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-osinstall:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Make osinstall.sh executable
      run: chmod +x osinstall.sh
    
    - name: Test osinstall.sh syntax
      run: bash -n osinstall.sh
    
    - name: Run shellcheck (blocking)
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        echo "Running shellcheck..."
        shellcheck osinstall.sh
        echo "✅ Shellcheck passed!"
    
    - name: Run osinstall.sh
      run: |
        set -e          # Exit on error
        set -u          # Exit on undefined variable
        set -o pipefail # Catch errors in pipes
        
        echo "Running osinstall.sh..."
        timeout 300 bash -x osinstall.sh
        
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Script completed successfully!"
        elif [ $EXIT_CODE -eq 124 ]; then
          echo "❌ Script timed out after 300 seconds!"
          exit 1
        else
          echo "❌ Script failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
    
    - name: Check for common issues
      run: |
        echo "Checking for common shell script issues..."
        ISSUES_FOUND=0
        
        # Check for unquoted variables
        if grep -n '\$[A-Za-z_][A-Za-z0-9_]*[^"]' osinstall.sh | grep -v '#'; then
          echo "⚠️  Warning: Found potentially unquoted variables"
          ISSUES_FOUND=1
        fi
        
        # Check for use of cd without error checking
        if grep -n '^[[:space:]]*cd ' osinstall.sh | grep -v '||' | grep -v '&&'; then
          echo "⚠️  Warning: Found cd commands without error checking"
          ISSUES_FOUND=1
        fi
        
        if [ $ISSUES_FOUND -eq 0 ]; then
          echo "✅ No common issues found"
        else
          echo "❌ Found potential issues - please review"
          exit 1
        fi
    
    - name: Test script in Docker (Ubuntu 24.04)
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace ubuntu:24.04 bash -c "
          set -e
          cd /workspace
          apt-get update
          apt-get install -y sudo
          bash -n osinstall.sh
          echo '✅ Script syntax is valid in Docker environment'
        "

    # This step only runs if all previous steps succeeded
    - name: Success summary
      run: |
        echo "=========================================="
        echo "✅ All tests passed successfully!"
        echo "=========================================="
